      search: "名前・手法・作者で検索", count: "{n} 件を表示", clear: "絞り込みを解除", featured: "まずはこちら",
      empty: "条件に合うプロジェクトはありません。", play: "動画を再生", close: "閉じる", openOn: "{p} で開く",
      none: "特定の機種なし", sim: "sim",
      types: { code: "コード", tutorial: "チュートリアル", paper: "論文", news: "報道" },
      foot: "データは <a href=\"{readme}\">README のリスト</a>から生成しており、リストが正です。LimX のロボットで何か作りましたか？<a href=\"{submit}\">投稿はこちら</a>。動画とサムネイルの権利は各制作者に帰属します。" },
    ko: { gallery: "갤러리", list: "GitHub 전체 목록", h1: "사람들이 LimX 로봇으로 만든 것들",
      lead: "커뮤니티와 파트너가 만든 프로젝트, 논문, 도입 사례 {n}건. 기종을 고르고 범위를 좁혀 데모 영상을 바로 재생하세요.",
      all: "전체 기종", allCats: "전체 분류", real: "실제 로봇만", video: "영상 있음",
      search: "이름, 방법, 저자로 검색", count: "{n}건 표시", clear: "필터 지우기", featured: "먼저 볼 것",
      empty: "조건에 맞는 프로젝트가 없습니다.", play: "영상 재생", close: "닫기", openOn: "{p}에서 열기",
      none: "특정 기종 없음", sim: "sim",
      types: { code: "코드", tutorial: "튜토리얼", paper: "논문", news: "보도" },
      foot: "<a href=\"{readme}\">README 목록</a>에서 생성되며, 목록이 기준입니다. LimX 로봇으로 무언가 만들었나요? <a href=\"{submit}\">제출하기</a>. 영상과 썸네일의 권리는 각 제작자에게 있습니다." }
  };
  var TYPE_ORDER = ["code", "tutorial", "paper", "news"];
  var PRIMARY = ["code", "project", "paper", "model", "dataset", "tutorial", "news", "result", "announcement", "video"];

  var st = { lang: "en", robot: "", cat: "", type: "", real: false, vid: false, q: "" };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); };
  var fmt = function (s, o) { return s.replace(/\{(\w+)\}/g, function (_, k) { return o[k]; }); };

  function readHash() {
    var h = new URLSearchParams(location.hash.slice(1));
    var saved = null;
    try { saved = localStorage.getItem("awesome-limx-lang"); } catch (e) {}
    var nav = (navigator.language || "en").toLowerCase();
    var guess = nav.indexOf("zh") === 0 ? "cn" : nav.indexOf("ja") === 0 ? "ja" : nav.indexOf("ko") === 0 ? "ko" : "en";
    st.lang = S[h.get("lang")] ? h.get("lang") : (S[saved] ? saved : guess);
    st.robot = D.robots.indexOf(h.get("robot")) >= 0 ? h.get("robot") : "";
    st.cat = h.get("cat") || "";
    st.type = TYPE_ORDER.indexOf(h.get("type")) >= 0 ? h.get("type") : "";
    st.real = h.get("real") === "1";
    st.vid = h.get("video") === "1";
    st.q = h.get("q") || "";
  }
  function writeHash() {
    var h = new URLSearchParams();
    if (st.lang !== "en") h.set("lang", st.lang);
    if (st.robot) h.set("robot", st.robot);
    if (st.cat !== "") h.set("cat", st.cat);
    if (st.type) h.set("type", st.type);
    if (st.real) h.set("real", "1");
    if (st.vid) h.set("video", "1");
    if (st.q) h.set("q", st.q);
    var s = h.toString();
    history.replaceState(null, "", s ? "#" + s : location.pathname + location.search);
  }

  function rc(item) { return item.robots.length ? "var(--" + item.robots[0] + ")" : "var(--none)"; }
  // The card title opens the most useful link: code first, then the project page, then the paper.
  function primaryUrl(item) {
    for (var p = 0; p < PRIMARY.length; p++)
      for (var i = 0; i < item.urls.length; i++)
        if (kindOf(item.t.en.links[i]) === PRIMARY[p]) return item.urls[i];
    return item.urls[0] || REPO;
  }
  function kindOf(label) { return String(label || "").replace(/\s*\(.*$/, "").toLowerCase(); }
  function hay(item) {
    var t = item.t[st.lang], e = item.t.en;
    return (t.name + " " + t.desc + " " + t.author + " " + t.sub + " " + e.desc + " " + e.sub + " " + item.robots.join(" ") + " " + item.year)
      .replace(/<[^>]+>/g, " ").toLowerCase();
  }
  function matches(item, skip) {
    if (skip !== "robot" && st.robot && item.robots.indexOf(st.robot) < 0) return false;
    if (st.cat !== "" && String(item.section) !== st.cat) return false;
    if (st.type && item.type !== st.type) return false;
    if (st.real && item.sim) return false;
    if (st.vid && !item.video) return false;
    if (st.q) {
      var h = hay(item), words = st.q.toLowerCase().split(/\s+/).filter(Boolean);
      for (var i = 0; i < words.length; i++) if (h.indexOf(words[i]) < 0) return false;
    }
    return true;
  }
  function filtered() { return !!(st.robot || st.cat !== "" || st.type || st.real || st.vid || st.q); }

  function card(item) {
    var t = item.t[st.lang], L = S[st.lang];
    var url = primaryUrl(item);
    var thumb;
    var what = esc(t.sub || D.sections[st.lang][item.section]);
    var badge = item.sim ? '<span class="badge">' + esc(t.sim || L.sim) + "</span>" : "";
    var ph = '<span class="ph"><span class="what">' + what + '</span><span class="big">' + esc(item.robots[0] || "LimX") + "</span></span>";
    var img = item.thumb ? '<img loading="lazy" decoding="async" alt="" src="' + esc(item.thumb) + '" onerror="this.remove()">' : "";
    // A video file with no thumbnail: let the browser show one of its frames.
    if (!img && item.video && item.video.provider === "file")
      img = '<video muted playsinline preload="metadata" tabindex="-1" aria-hidden="true" src="' + esc(item.video.id) + '#t=1"></video>';
    if (item.video) {
      thumb = '<button class="thumb" type="button" data-video="' + esc(item.id) + '" aria-label="' + esc(L.play + ": " + t.name) + '">' +
        ph + img + '<span class="play"></span>' + badge + "</button>";
    } else {
      thumb = '<a class="thumb' + (item.thumb ? "" : " bare") + '" href="' + esc(url) + '" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">' + ph + img + badge + "</a>";
    }
    var tags = item.robots.length
      ? item.robots.map(function (r) { return '<span class="tag" style="--rc:var(--' + r + ')">' + esc(r) + "</span>"; }).join("")
      : '<span class="tag" style="--rc:var(--none)">' + esc(L.none) + "</span>";
    var links = item.urls.map(function (u, i) {
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(t.links[i] || item.t.en.links[i]) + "</a>";
    }).join("");
    return '<article class="card" style="--rc:' + rc(item) + '">' + thumb +
      '<div class="body"><h3 class="name"><a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(t.name) + "</a></h3>" +
      (t.desc ? '<p class="desc">' + t.desc + "</p>" : "") +
      '<div class="meta">' + tags + "<span>" + (item.year || "") + '</span><span class="who">' + t.author + "</span></div>" +
      '<div class="links"><span class="kind">' + esc(t.type || L.types[item.type]) + "</span>" + links + "</div></div></article>";
  }

  function renderChrome() {
    var L = S[st.lang];
    document.documentElement.lang = { en: "en", cn: "zh-CN", ja: "ja", ko: "ko" }[st.lang];
    document.title = "Awesome LimX " + L.gallery;
    [].forEach.call(document.querySelectorAll("[data-i]"), function (el) { el.textContent = L[el.getAttribute("data-i")]; });
    $("lead").textContent = fmt(L.lead, { n: D.items.length });
    $("q").placeholder = L.search; $("q").setAttribute("aria-label", L.search);
    $("listlink").href = REPO + "/blob/main/" + README[st.lang];
    $("foot").innerHTML = fmt(L.foot, { readme: REPO + "/blob/main/" + README[st.lang], submit: SUBMIT });
    var langs = document.querySelector(".langs");
    langs.innerHTML = LANGS.map(function (l) {
      return '<button type="button" data-lang="' + l[0] + '" aria-pressed="' + (l[0] === st.lang) + '">' + l[1] + "</button>";
    }).join("");
    var cat = $("cat");
    cat.innerHTML = '<option value="">' + esc(L.allCats) + "</option>" + D.sections[st.lang].map(function (s, i) {
      return '<option value="' + i + '">' + esc(s) + "</option>";
    }).join("");
    cat.value = st.cat;
    $("types").innerHTML = TYPE_ORDER.map(function (k) {
      return '<button class="chip" type="button" data-type="' + k + '" aria-pressed="' + (st.type === k) + '">' + esc(L.types[k]) + "</button>";
    }).join("");
    $("q").value = st.q;
  }

  function render() {
    var L = S[st.lang];
    // Lineup counts follow the other filters, so the numbers say what each robot would show.
    var lineup = [["", L.all]].concat(D.robots.map(function (r) { return [r, r]; }));
    $("lineup").innerHTML = lineup.map(function (r) {
      var n = D.items.filter(function (it) { return matches(it, "robot") && (!r[0] || it.robots.indexOf(r[0]) >= 0); }).length;
      return '<button class="robot" type="button" data-robot="' + r[0] + '" aria-pressed="' + (st.robot === r[0]) + '" style="--rc:' +
        (r[0] ? "var(--" + r[0] + ")" : "var(--ink)") + '"><b>' + esc(r[1]) + "</b><small>" + n + "</small></button>";
    }).join("");
    $("real").setAttribute("aria-pressed", st.real);
    $("vid").setAttribute("aria-pressed", st.vid);
    [].forEach.call(document.querySelectorAll("#types .chip"), function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-type") === st.type); });

    var shown = D.items.filter(function (it) { return matches(it); });
    $("count").textContent = fmt(L.count, { n: shown.length });
    $("clear").hidden = !filtered();

    var html = "";
    if (!filtered() && D.featured.length) {
      var byId = {}; D.items.forEach(function (it) { byId[it.id] = it; });
      html += '<section class="group featured"><h2>' + esc(L.featured) + '</h2><div class="grid">' +
        D.featured.map(function (id) { return card(byId[id]); }).join("") + "</div></section>";
    }
    var groups = {};
    shown.forEach(function (it) { (groups[it.section] = groups[it.section] || []).push(it); });
    Object.keys(groups).sort(function (a, b) { return a - b; }).forEach(function (s) {
      html += '<section class="group"><h2>' + esc(D.sections[st.lang][s]) + "<span>" + groups[s].length + "</span></h2>" +
        '<div class="grid">' + groups[s].map(card).join("") + "</div></section>";
    });
    if (!shown.length) html = '<div class="empty"><p>' + esc(L.empty) + '</p><button class="chip" type="button" id="clear2">' + esc(L.clear) + "</button></div>";
    $("main").innerHTML = html;
    writeHash();
  }

  function openVideo(id) {
    var it = D.items.filter(function (x) { return x.id === id; })[0];
    if (!it || !it.video) return;
    var v = it.video, L = S[st.lang];
    var file = v.provider === "file";
    $("player").hidden = file; $("vplayer").hidden = !file;
    if (file) {
      $("vplayer").src = v.id;
      var pr = $("vplayer").play(); if (pr && pr.catch) pr.catch(function () {});
    } else {
      $("player").src = v.provider === "youtube"
        ? "https://www.youtube-nocookie.com/embed/" + v.id + "?autoplay=1&rel=0"
        : "https://player.bilibili.com/player.html?bvid=" + v.id + "&autoplay=1&high_quality=1";
    }
    var p = v.provider === "youtube" ? "YouTube" : v.provider === "bilibili" ? "bilibili" : new URL(v.url).hostname;
    $("dlink").href = v.url; $("dlink").textContent = it.t[st.lang].name + " · " + fmt(L.openOn, { p: p });
    if ($("dlg").showModal) $("dlg").showModal(); else window.open(v.url, "_blank");
  }
  function stopVideo() {
    $("player").src = "about:blank";
    var vp = $("vplayer"); vp.pause(); vp.removeAttribute("src"); vp.load();
  }
  function closeVideo() { stopVideo(); if ($("dlg").open) $("dlg").close(); }

  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("button") : null;
    if (!t) return;
    if (t.hasAttribute("data-lang")) {
      st.lang = t.getAttribute("data-lang");
      try { localStorage.setItem("awesome-limx-lang", st.lang); } catch (err) {}
      renderChrome(); render();
    } else if (t.hasAttribute("data-robot")) { st.robot = t.getAttribute("data-robot"); render(); }
    else if (t.hasAttribute("data-type")) { var k = t.getAttribute("data-type"); st.type = st.type === k ? "" : k; render(); }
    else if (t.id === "real") { st.real = !st.real; render(); }
    else if (t.id === "vid") { st.vid = !st.vid; render(); }
    else if (t.id === "clear" || t.id === "clear2") {
      st.robot = ""; st.cat = ""; st.type = ""; st.real = false; st.vid = false; st.q = "";
      $("q").value = ""; $("cat").value = ""; render();
    }
    else if (t.hasAttribute("data-video")) openVideo(t.getAttribute("data-video"));
    else if (t.id === "dclose") closeVideo();
  });
  $("cat").addEventListener("change", function () { st.cat = this.value; render(); });
  var timer;
  $("q").addEventListener("input", function () { var v = this.value; clearTimeout(timer); timer = setTimeout(function () { st.q = v.trim(); render(); }, 120); });
  $("dlg").addEventListener("close", stopVideo);
  // Esc must close the player even when the video's own controls have focus.
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && $("dlg").open) { e.preventDefault(); closeVideo(); } });
  $("dlg").addEventListener("click", function (e) { if (e.target === this) closeVideo(); });
  window.addEventListener("hashchange", function () { readHash(); renderChrome(); render(); });

  readHash(); renderChrome(); render();
})();
</script>
</body>
</html>
