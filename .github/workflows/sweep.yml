name: Candidate sweep

# Looks for public work that uses LimX robots and is not in the list yet, and
# keeps the result in one open issue. It never edits the list: a person reviews
# the issue and adds what fits. What to search for: scripts/sweep_config.json.
on:
  schedule:
    # 1st of each month, 02:17 UTC.
    - cron: '17 2 1 * *'
  workflow_dispatch:
    inputs:
      robots:
        description: 'Robots to check, comma-separated (empty: all in the config)'
        required: false
      sources:
        description: 'Sources, comma-separated: github,hf,arxiv,openalex (empty: all enabled)'
        required: false
      since:
        description: 'Only items touched since YYYY-MM-DD, or a number of days (empty: no limit)'
        required: false
      mark_seen:
        description: 'Review done: stop reporting the candidates from the last sweep, then close the issue (add the ones you want first)'
        type: boolean
        default: false
      keep:
        description: 'With mark_seen: candidates to keep reporting, comma-separated URLs or owner/repo'
        required: false

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: sweep
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TITLE: 'Candidate sweep: projects not yet in the list'

jobs:
  sweep:
    name: Sweep
    if: ${{ !inputs.mark_seen }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Search
        env:
          ROBOTS: ${{ inputs.robots }}
          SOURCES: ${{ inputs.sources }}
          SINCE: ${{ inputs.since }}
        run: |
          args=()
          [ -n "$ROBOTS" ] && args+=(--robots "$ROBOTS")
          [ -n "$SOURCES" ] && args+=(--sources "$SOURCES")
          # A scheduled run only looks at the last 60 days; run by hand with an empty `since` for the full history.
          [ -z "$SINCE" ] && [ "${{ github.event_name }}" = "schedule" ] && SINCE=60
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          python scripts/find_candidates.py "${args[@]}"
          head -c 900000 sweep_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-report
          retention-days: 90
          path: |
            sweep_report.md
            sweep_candidates.json
      - name: Update the sweep issue
        run: |
          total=$(python -c "import json;print(len(json.load(open('sweep_candidates.json'))))")
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title==env.TITLE))[0].number // empty")
          if [ "$total" = "0" ]; then
            # Unreviewed candidates would still be reported, so zero means nothing is waiting.
            if grep -q '^\*\*\(Failed\|Errors\|Partial\)' sweep_report.md; then echo "no candidates, but some sources failed: see the report"; exit 0; fi
            [ -n "$n" ] && gh issue close "$n" --comment "Sweep on $(date -u +%F): nothing new to review."
            exit 0
          fi
          # Issue bodies cap at 65536 characters: cut the report at a line and say how much is shown.
          python - <<'PY'
          import json, os
          rep = open("sweep_report.md", encoding="utf-8").read().splitlines()
          total = len(json.load(open("sweep_candidates.json")))
          out, size, shown = [], 0, 0
          for line in rep:
              if size + len(line.encode()) > 50000:
                  break
              out.append(line); size += len(line.encode()) + 1
              shown += line.startswith("| [")
          run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          head = (f"**{total} candidates, {shown} shown here.**" + ("" if shown == total else
                  f" The rest are in the full report ([run]({run}), artifact `sweep-report`): review those too before marking.") + "\n")
          tail = ["", f"Full report: {run}", "",
                  "After review: add the ones that fit, then run this workflow with **mark_seen** ticked "
                  "(list any to come back to under **keep**). It marks exactly the candidates of this run.",
                  f"<!-- sweep-run: {os.environ['GITHUB_RUN_ID']} -->"]
          open("body.md", "w", encoding="utf-8").write(head + "\n" + "\n".join(out + tail) + "\n")
          PY
          if [ -n "$n" ]; then gh issue edit "$n" --body-file body.md; gh issue comment "$n" --body "Updated by the sweep on $(date -u +%F): $total candidates."; else gh issue create --title "$TITLE" --body-file body.md; fi

  mark-seen:
    name: Mark reviewed
    if: ${{ inputs.mark_seen }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch the candidate list of the sweep in the open issue
        run: |
          # Mark exactly what the issue showed: the run id is in the issue, so a sweep
          # that ran after the review cannot slip unreviewed candidates in.
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title==env.TITLE))[0].number // empty")
          [ -z "$n" ] && { echo "no open sweep issue: nothing to mark"; exit 1; }
          id=$(gh issue view "$n" --json body --jq .body | sed -n 's/.*<!-- sweep-run: \([0-9]*\) -->.*/\1/p' | head -1)
          [ -z "$id" ] && { echo "the issue does not name its sweep run"; exit 1; }
          gh run download "$id" -n sweep-report -D last || { echo "artifact of run $id is gone (kept 90 days): run a new sweep"; exit 1; }
          cp last/sweep_candidates.json sweep_candidates.json
          echo "ISSUE=$n" >> "$GITHUB_ENV"
      - name: Add them to sweep_seen.txt
        env:
          KEEP: ${{ inputs.keep }}
        run: |
          python scripts/find_candidates.py --mark-seen --keep "$KEEP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sweep_seen.txt
          git diff --cached --quiet || { git commit -m "chore: mark sweep candidates as reviewed (auto)"; git push; }
          gh issue close "$ISSUE" --comment "Reviewed. The ones not listed are now in scripts/sweep_seen.txt."
