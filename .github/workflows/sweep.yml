name: Candidate sweep

# Looks for public work that uses LimX robots and is not in the list yet. It
# never edits the list and opens no issues: the report is on the run's summary
# page and in its `sweep-report` artifact, and a person reviews it there.
# What to search for: scripts/sweep_config.json.
#
# Review loop:
#   1. Open the run (Actions > Candidate sweep), read the summary.
#   2. Add the projects that fit to the README.
#   3. Run this workflow again with "mark_seen" ticked and that run's ID, so
#      the rest stop showing up. Put any you mean to come back to under "keep".
on:
  schedule:
    # 1st of each month, 02:17 UTC.
    - cron: '17 2 1 * *'
  workflow_dispatch:
    inputs:
      robots:
        description: 'Robots to check, comma-separated (empty: all in the config)'
        required: false
      sources:
        description: 'Sources, comma-separated: github,hf,arxiv,openalex (empty: all enabled)'
        required: false
      since:
        description: 'Only items touched since YYYY-MM-DD, or a number of days (empty: no limit)'
        required: false
      mark_seen:
        description: 'Review done: mark the candidates of the run below as seen (add the ones you want to the README first)'
        type: boolean
        default: false
      run_id:
        description: 'With mark_seen: ID of the sweep run you reviewed (the number at the end of its URL)'
        required: false
      keep:
        description: 'With mark_seen: candidates to keep reporting, comma-separated URLs or owner/repo'
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: sweep
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  sweep:
    name: Sweep
    if: ${{ !inputs.mark_seen }}
    runs-on: ubuntu-latest
    # The sources' time budgets (max_minutes in the config) add up to 50 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Search
        env:
          ROBOTS: ${{ inputs.robots }}
          SOURCES: ${{ inputs.sources }}
          SINCE: ${{ inputs.since }}
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          [ -n "$ROBOTS" ] && args+=(--robots "$ROBOTS")
          [ -n "$SOURCES" ] && args+=(--sources "$SOURCES")
          # A scheduled run only looks at the last 60 days; run by hand with an empty `since` for the full history.
          [ -z "$SINCE" ] && [ "$EVENT" = "schedule" ] && SINCE=60
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          python scripts/find_candidates.py "${args[@]}"
      - name: Put the report on the summary page
        if: always()
        run: |
          {
            echo "**Run ID for mark_seen: \`${GITHUB_RUN_ID}\`**"
            echo
            echo "After review: add the ones that fit to the README, then run this workflow with **mark_seen** ticked and this run ID."
            echo
            head -c 900000 sweep_report.md 2>/dev/null || echo "No report: the search step failed, see its log."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-report
          retention-days: 90
          path: |
            sweep_report.md
            sweep_candidates.json
      - name: Fail if a source failed outright
        run: |
          # A source where every request failed is silent breakage (a revoked token, a changed API):
          # a red run sends a notification, a passing one with a warning does not.
          if grep -q '^\*\*Failed' sweep_report.md; then
            grep '^## \|^\*\*Failed' sweep_report.md
            exit 1
          fi

  mark-seen:
    name: Mark reviewed
    if: ${{ inputs.mark_seen }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch the candidate list of the reviewed run
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          # Marks exactly the run you name, so a sweep that ran after your review
          # cannot slip unreviewed candidates in.
          id="${RUN_ID//[^0-9]/}"
          [ -z "$id" ] && { echo "::error::Give the ID of the sweep run you reviewed (run_id)."; exit 1; }
          gh run download "$id" -n sweep-report -D last || { echo "::error::No sweep report in run $id (artifacts are kept 90 days)."; exit 1; }
          cp last/sweep_candidates.json sweep_candidates.json
      - name: Add them to sweep_seen.txt
        env:
          KEEP: ${{ inputs.keep }}
        run: |
          python scripts/find_candidates.py --mark-seen --keep "$KEEP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sweep_seen.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: mark sweep candidates as reviewed (auto)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase origin main; done
          exit 1
