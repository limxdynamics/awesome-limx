name: Candidate sweep

# Looks for public work that uses LimX robots and is not in the list yet, and
# keeps the result in one open issue. It never edits the list: a person reviews
# the issue and adds what fits. What to search for: scripts/sweep_config.json.
on:
  schedule:
    # 1st of each month, 02:17 UTC.
    - cron: '17 2 1 * *'
  workflow_dispatch:
    inputs:
      robots:
        description: 'Robots to check, comma-separated (empty: all in the config)'
        required: false
      sources:
        description: 'Sources, comma-separated: github,hf,arxiv,openalex (empty: all enabled)'
        required: false
      since:
        description: 'Only items touched since YYYY-MM-DD, or a number of days (empty: no limit)'
        required: false
      mark_seen:
        description: 'Review done: stop reporting the candidates from the last sweep, then close the issue (add the ones you want first)'
        type: boolean
        default: false
      keep:
        description: 'With mark_seen: candidates to keep reporting, comma-separated URLs or owner/repo'
        required: false

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: sweep
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TITLE: 'Candidate sweep: projects not yet in the list'

jobs:
  sweep:
    name: Sweep
    if: ${{ !inputs.mark_seen }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Search
        env:
          ROBOTS: ${{ inputs.robots }}
          SOURCES: ${{ inputs.sources }}
          SINCE: ${{ inputs.since }}
        run: |
          args=()
          [ -n "$ROBOTS" ] && args+=(--robots "$ROBOTS")
          [ -n "$SOURCES" ] && args+=(--sources "$SOURCES")
          [ -n "$SINCE" ] && args+=(--since "$SINCE")
          python scripts/find_candidates.py "${args[@]}"
          head -c 900000 sweep_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-report
          retention-days: 90
          path: |
            sweep_report.md
            sweep_candidates.json
      - name: Update the sweep issue
        run: |
          # Issue bodies cap at 65536 characters, so the issue gets the top of the report and a link to the rest.
          if [ "$(python -c "import json;print(len(json.load(open('sweep_candidates.json'))))")" = "0" ]; then
            echo "nothing new"; exit 0
          fi
          { head -c 50000 sweep_report.md; echo; echo "Full report: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; echo;
            echo "After review: add the ones that fit, then run this workflow with **mark_seen** ticked (list any to come back to under **keep**)."; } > body.md
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title==env.TITLE))[0].number // empty")
          if [ -n "$n" ]; then gh issue edit "$n" --body-file body.md; else gh issue create --title "$TITLE" --body-file body.md; fi

  mark-seen:
    name: Mark reviewed
    if: ${{ inputs.mark_seen }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch the candidate list from the last sweep
        run: |
          # The full list rides in the last sweep's artifact, so it is never cut short like an issue body.
          for id in $(gh run list --workflow sweep.yml --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            gh run download "$id" -n sweep-report -D last 2>/dev/null && { echo "using run $id"; break; }
          done
          [ -f last/sweep_candidates.json ] || { echo "no sweep artifact found (they expire after 90 days): run a sweep first"; exit 1; }
          cp last/sweep_candidates.json sweep_candidates.json
      - name: Add them to sweep_seen.txt
        env:
          KEEP: ${{ inputs.keep }}
        run: |
          python scripts/find_candidates.py --mark-seen --keep "$KEEP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sweep_seen.txt
          git diff --cached --quiet || { git commit -m "chore: mark sweep candidates as reviewed (auto)"; git push; }
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title==env.TITLE))[0].number // empty")
          [ -n "$n" ] && gh issue close "$n" --comment "Reviewed. The ones not listed are now in scripts/sweep_seen.txt." || true
