name: Robot pages and gallery

# Rebuilds robots/*.md and the gallery (docs/index.html) whenever the README
# tables change on main, so neither falls behind the list.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - README_cn.md
      - README_ja.md
      - README_ko.md
      - scripts/build_robot_pages.py
      - scripts/build_gallery.py
      - scripts/gallery_template.html
      - scripts/gallery.json
      - docs/thumbs/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-pages
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Build from the newest main, not the commit that triggered the run,
          # so a README change pushed meanwhile is not left out.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build robot pages and gallery
        run: |
          python scripts/build_robot_pages.py
          python scripts/build_gallery.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robots docs
          git diff --cached --quiet && exit 0
          git commit -m "chore: rebuild robot pages and gallery (auto)"
          # main may have moved while this ran: rebase onto it and rebuild, a few times if needed.
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_robot_pages.py
            python scripts/build_gallery.py
            git add robots docs
            git diff --cached --quiet && exit 0
            git commit -m "chore: rebuild robot pages and gallery (auto)"
          done
          exit 1
