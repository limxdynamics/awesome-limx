name: Robot pages

# Rebuilds robots/*.md whenever the README tables change on main, so the
# per-robot pages never fall behind the list.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - README_cn.md
      - README_ja.md
      - README_ko.md
      - scripts/build_robot_pages.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-pages
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build robot pages
        run: python scripts/build_robot_pages.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robots
          git diff --cached --quiet && exit 0
          git commit -m "chore: rebuild robot pages (auto)"
          git push
