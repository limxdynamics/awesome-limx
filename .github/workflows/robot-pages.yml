name: Robot pages and gallery

# Rebuilds robots/*.md and the gallery (docs/index.html) from the README once a
# day, so a busy day of edits ends in one rebuild commit instead of one per push.
# Nothing is committed when the pages are already up to date. To publish sooner,
# run it by hand (Actions > Robot pages and gallery > Run workflow), or run the
# two build scripts locally and commit the result.
on:
  schedule:
    - cron: '17 18 * * *'   # 02:17 Beijing time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-pages
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build robot pages and gallery
        run: |
          python scripts/build_robot_pages.py
          python scripts/build_gallery.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robots docs
          git diff --cached --quiet && exit 0
          git commit -m "chore: rebuild robot pages and gallery (auto)"
          # main may have moved while this ran: rebase onto it and rebuild, a few times if needed.
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_robot_pages.py
            python scripts/build_gallery.py
            git add robots docs
            git diff --cached --quiet && exit 0
            git commit -m "chore: rebuild robot pages and gallery (auto)"
          done
          exit 1
