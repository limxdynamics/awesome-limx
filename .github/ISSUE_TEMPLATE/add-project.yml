name: Add a project
description: Suggest a project built on LimX hardware or SDK
title: "add: "
labels: ["entry-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. One project per issue, please.
        If you are the maintainer, say so in the last question — it is the fastest path to getting listed.
  - type: input
    id: repo
    attributes:
      label: Repository URL
      description: Public repository only. Links only — we do not copy code.
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: What does it run on?
      multiple: true
      options:
        - TRON1
        - TRON2
        - limxsdk (low-level SDK)
        - Other LimX hardware
    validations:
      required: true
  - type: input
    id: line
    attributes:
      label: One-line description
      description: What it does, in one sentence. No superlatives.
      placeholder: Docker images and launch scripts for running the TRON1 simulator.
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who made it?
      description: Person, lab or company, as it should appear in the italic line.
      placeholder: RoboTUM student team
    validations:
      required: true
  - type: dropdown
    id: relation
    attributes:
      label: Your relationship to the project
      options:
        - I am the maintainer (I agree to be listed publicly)
        - I am not the maintainer, but the project says publicly it is built on LimX
        - I am submitting on behalf of a company and I am allowed to make this public
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Optional. If the project is a commercial product not yet announced, tell us here and we will hold off.
    validations:
      required: false
