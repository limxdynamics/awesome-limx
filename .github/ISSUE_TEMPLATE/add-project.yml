name: Submit a case / 提交案例
description: Share a project, paper, tutorial, competition result or deployment built on LimX hardware or SDK / 提交基于 LimX 硬件或 SDK 的项目、论文、教程、比赛成绩或落地案例
title: "case: "
labels: ["entry-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your work. A link and one sentence is all we need — we fill in the rest ourselves.
        感谢分享。一个链接、一句话就够，其余我们自己补。

        日本語・한국어でも記入できます / 한국어로 작성해도 됩니다.

        **Before you submit / 提交前请确认**
        - A LimX robot is one of the main subjects, or the project ships a complete, runnable setup for it (training config, controller or deployment). Work where the LimX robot is only one model in a collection, or one name in a list of supported robots, is not listed. See [What we accept](https://github.com/limxdynamics/awesome-limx/blob/main/CONTRIBUTING.md#what-we-accept).
        - LimX 机器人是主要研究对象之一，或项目为它提供了完整、可直接运行的配置（训练配置、控制器或部署）。LimX 机器人只是合集里的一个模型、或只是支持列表里的一个名字，不收录。详见[收录标准](https://github.com/limxdynamics/awesome-limx/blob/main/CONTRIBUTING_cn.md#收录标准)。
        - Official code or model files re-uploaded without changes of your own are not listed. / 原样转传的官方代码或模型文件不收录。
        - Submitting means you are happy to be listed. Owners can ask to be removed at any time, for any reason. / 提交即视为同意收录。项目所有者可随时要求移除，无需说明理由。
  - type: textarea
    id: links
    attributes:
      label: Links / 链接
      description: |
        Public links only, one per line. One is enough.
        只填公开链接，每行一个，一个就够。
      placeholder: |
        Code / 代码: https://github.com/owner/repo
        Paper / 论文: https://arxiv.org/abs/0000.00000
        Video / 视频: https://www.bilibili.com/video/...
    validations:
      required: true
  - type: input
    id: line
    attributes:
      label: One sentence / 一句话说明
      description: |
        What it does, and which LimX robot it runs on — about 8 to 18 words (15 to 40 Chinese characters). English, Chinese, Japanese or Korean.
        做了什么，用的是哪款 LimX 机器人，大约 15 到 40 个字（英文 8 到 18 个词）。中、英、日、韩文均可。
      placeholder: TRON2 上的楼梯攀爬策略，仿真训练后无需微调直接部署
    validations:
      required: true
  - type: dropdown
    id: product
    attributes:
      label: LimX product used / 使用的产品
      description: |
        Optional — leave it blank if you are not sure and we will figure it out.
        选填。不确定可以留空，我们来判断。
      multiple: true
      options:
        - TRON1
        - TRON2
        - Oli
        - Luna
        - P1
        - W1
        - LimX SDK only / 仅 LimX SDK
        - Other / 其他
    validations:
      required: false
