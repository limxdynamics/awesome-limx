<style>
:root {
  --bg: #f5f7fa; --surface: #ffffff; --ink: #14181d; --muted: #59616c; --faint: #8a93a0;
  --line: #e6e9ee; --accent: #2f6feb; --accent-ink: #ffffff;
  --TRON1: #2f6feb; --TRON2: #0e8f80; --Oli: #7357e8; --Luna: #c4307a; --P1: #b06f12; --W1: #3d8a37; --none: #59616c;
  --tint: 11%;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d10; --surface: #14181d; --ink: #e6e9ee; --muted: #a3abb6; --faint: #737c88;
    --line: #262c34; --accent: #6a9bff; --accent-ink: #0b0d10;
    --TRON1: #6a9bff; --TRON2: #3cc3b0; --Oli: #a28fff; --Luna: #f06aa8; --P1: #e0a548; --W1: #79c46f; --none: #8a93a0;
    --tint: 16%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d10; --surface: #14181d; --ink: #e6e9ee; --muted: #a3abb6; --faint: #737c88;
  --line: #262c34; --accent: #6a9bff; --accent-ink: #0b0d10;
  --TRON1: #6a9bff; --TRON2: #3cc3b0; --Oli: #a28fff; --Luna: #f06aa8; --P1: #e0a548; --W1: #79c46f; --none: #8a93a0;
  --tint: 16%; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.55 Poppins, "PingFang SC", "Hiragino Sans", "Apple SD Gothic Neo", "Noto Sans CJK SC", "Microsoft YaHei", "Malgun Gothic", system-ui, sans-serif;
}
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }

/* Header */
.top { display: flex; align-items: center; gap: 16px; padding: 18px 0; }
.mark { display: flex; align-items: baseline; gap: 8px; text-decoration: none; font-weight: 600; font-size: 17px; }
.mark span { color: var(--faint); font-weight: 400; }
.top .spacer { flex: 1; }
.langs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.langs button { border: 0; background: none; padding: 5px 10px; font-size: 13px; cursor: pointer; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.toplink { font-size: 13px; color: var(--muted); text-decoration: none; white-space: nowrap; }
.toplink:hover { color: var(--ink); text-decoration: underline; }

.intro { padding-top: 28px; padding-bottom: 8px; }
.intro h1, .intro .lead { max-width: 760px; }
h1 { font-size: clamp(28px, 4.4vw, 44px); line-height: 1.12; font-weight: 600; margin: 0 0 12px; letter-spacing: -0.01em; text-wrap: balance; }
.lead { color: var(--muted); margin: 0; font-size: 16px; }

/* Robot lineup: the one loud element */
.lineup { display: flex; gap: 4px; margin-top: 28px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.lineup::-webkit-scrollbar { display: none; }
.robot {
  flex: 1 0 auto; min-width: 104px; border: 0; background: none; cursor: pointer; text-align: left;
  padding: 10px 14px 14px; border-bottom: 3px solid transparent; margin-bottom: -1px; color: var(--faint);
}
.robot b { display: block; font-size: clamp(20px, 2.6vw, 30px); font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
.robot small { font-size: 13px; }
.robot:hover { color: var(--ink); }
.robot[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--rc, var(--ink)); }
.robot[aria-pressed="true"] small { color: var(--muted); }

/* Filters */
.bar {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 12px 0; border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.search { flex: 1 1 240px; min-width: 0; position: relative; }
.search input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-size: 14px;
}
select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; font-size: 14px; max-width: 100%; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.count { font-size: 13px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.clear { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 0 2px; }

/* Sections */
main { padding: 8px 0 40px; }
.group { margin-top: 36px; }
.group h2 { font-size: 20px; font-weight: 600; margin: 0 0 14px; display: flex; gap: 10px; align-items: baseline; }
.group h2 span { font-size: 14px; font-weight: 400; color: var(--faint); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; }
.featured .grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }

/* Card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.thumb {
  position: relative; display: block; aspect-ratio: 16 / 9; overflow: hidden; border: 0; padding: 0; width: 100%; cursor: pointer;
  background: color-mix(in srgb, var(--rc) var(--tint), var(--surface)); text-align: left; color: var(--rc);
}
.thumb video { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; pointer-events: none; background: transparent; }
.thumb img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
.play, .badge { z-index: 2; }
.ph { position: absolute; inset: 0; }
.ph .illus { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--rc); }
.ph .tag-illus {
  position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: var(--rc); opacity: .8;
}
.ph .big {
  position: absolute; left: -0.04em; bottom: -0.2em; font-weight: 600; line-height: 1; letter-spacing: -0.04em;
  font-size: 92px; color: var(--rc); opacity: .28; white-space: nowrap;
}
.ph .what { position: absolute; left: 14px; top: 12px; right: 14px; font-size: 12.5px; color: var(--rc); font-weight: 500; }
.badge {
  position: absolute; right: 10px; top: 10px; font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px;
  background: var(--surface); color: var(--muted); border: 1px solid var(--line);
}
.play {
  position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%;
  background: rgba(10, 12, 16, .72); display: grid; place-items: center;
}
.play::after { content: ""; border-left: 17px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 5px; }
.thumb:hover .play { background: var(--accent); }
.body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.name { font-weight: 600; font-size: 16.5px; line-height: 1.3; margin: 0; }
.name a { text-decoration: none; }
.name a:hover { text-decoration: underline; }
.desc { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; text-wrap: pretty; }
.desc code { font-size: 12.5px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); margin-top: auto; padding-top: 4px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; color: var(--ink); }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rc); }
.meta .who a { text-decoration: none; }
.meta .who a:hover { text-decoration: underline; }
.links { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; border-top: 1px solid var(--line); padding-top: 10px; }
.links a { color: var(--accent); text-decoration: none; }
.links a:hover { text-decoration: underline; }
.kind { font-size: 12px; color: var(--faint); margin-right: auto; }

.empty { padding: 60px 0; text-align: center; color: var(--muted); }
.empty button { margin-top: 12px; }
footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--muted); font-size: 13.5px; }
footer a { color: var(--accent); }

/* Video dialog */
dialog { border: 0; padding: 0; background: #000; width: min(1000px, 94vw); border-radius: 10px; overflow: hidden; }
dialog::backdrop { background: rgba(5, 7, 10, .82); }
.player { aspect-ratio: 16 / 9; width: 100%; display: block; border: 0; }
.player[hidden] { display: none; }
.dbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; background: #14181d; color: #e6e9ee; font-size: 14px; }
.dbar a { color: #9ec0ff; }
.dbar button { border: 1px solid #3a414b; background: none; color: #e6e9ee; border-radius: 6px; padding: 4px 12px; cursor: pointer; }

@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .top { flex-wrap: wrap; gap: 10px; }
  .top .spacer { display: none; }
  .toplink { order: 3; }
  .intro { padding-top: 16px; }
  .robot { min-width: 84px; padding: 8px 10px 12px; }
  .featured .grid, .grid { grid-template-columns: 1fr; }
  .count { margin-left: 0; }
  .bar { position: static; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>

      var h = hay(item), words = st.q.toLowerCase().split(/\s+/).filter(Boolean);
      for (var i = 0; i < words.length; i++) if (h.indexOf(words[i]) < 0) return false;
    }
    return true;
  }
  function filtered() { return !!(st.robot || st.cat !== "" || st.type || st.real || st.vid || st.q); }

  function card(item) {
    var t = item.t[st.lang], L = S[st.lang];
    var url = primaryUrl(item);
    var thumb;
    var what = esc(t.sub || D.sections[st.lang][item.section]);
    var badge = item.sim ? '<span class="badge">' + esc(t.sim || L.sim) + "</span>" : "";
    // The drawn picture sits under any real thumbnail, so it also shows if that image fails to load.
    var real = item.thumb || (item.video && item.video.provider === "file");
    var ph = '<span class="ph">' + window.illustrate(item, D) + '<span class="what">' + what + "</span>" +
      (real ? "" : '<span class="tag-illus">' + esc(L.illus) + "</span>") + "</span>";
    var img = item.thumb ? '<img loading="lazy" decoding="async" alt="" src="' + esc(item.thumb) + '" onerror="this.remove()">' : "";
    // A video file with no thumbnail: let the browser show one of its frames.
    if (!img && item.video && item.video.provider === "file")
      img = '<video muted playsinline preload="metadata" tabindex="-1" aria-hidden="true" src="' + esc(item.video.id) + '#t=1"></video>';
    if (item.video) {
      thumb = '<button class="thumb" type="button" data-video="' + esc(item.id) + '" aria-label="' + esc(L.play + ": " + t.name) + '">' +
        ph + img + '<span class="play"></span>' + badge + "</button>";
    } else {
      thumb = '<a class="thumb" href="' + esc(url) + '" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">' + ph + img + badge + "</a>";
    }
    var tags = item.robots.length
      ? item.robots.map(function (r) { return '<span class="tag" style="--rc:var(--' + r + ')">' + esc(r) + "</span>"; }).join("")
      : '<span class="tag" style="--rc:var(--none)">' + esc(L.none) + "</span>";
    var links = item.urls.map(function (u, i) {
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(t.links[i] || item.t.en.links[i]) + "</a>";
    }).join("");
    return '<article class="card" style="--rc:' + rc(item) + '">' + thumb +
      '<div class="body"><h3 class="name"><a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(t.name) + "</a></h3>" +
      (t.desc ? '<p class="desc">' + t.desc + "</p>" : "") +
      '<div class="meta">' + tags + "<span>" + (item.year || "") + '</span><span class="who">' + t.author + "</span></div>" +
      '<div class="links"><span class="kind">' + esc(t.type || L.types[item.type]) + "</span>" + links + "</div></div></article>";
  }

  function renderChrome() {
    var L = S[st.lang];
    document.documentElement.lang = { en: "en", cn: "zh-CN", ja: "ja", ko: "ko" }[st.lang];
    document.title = "Awesome LimX " + L.gallery;
    [].forEach.call(document.querySelectorAll("[data-i]"), function (el) { el.textContent = L[el.getAttribute("data-i")]; });
    $("lead").textContent = fmt(L.lead, { n: D.items.length });
    $("q").placeholder = L.search; $("q").setAttribute("aria-label", L.search);
    $("listlink").href = REPO + "/blob/main/" + README[st.lang];
    $("foot").innerHTML = fmt(L.foot, { readme: REPO + "/blob/main/" + README[st.lang], submit: SUBMIT });
    var langs = document.querySelector(".langs");
    langs.innerHTML = LANGS.map(function (l) {
      return '<button type="button" data-lang="' + l[0] + '" aria-pressed="' + (l[0] === st.lang) + '">' + l[1] + "</button>";
    }).join("");
    var cat = $("cat");
    cat.innerHTML = '<option value="">' + esc(L.allCats) + "</option>" + D.sections[st.lang].map(function (s, i) {
      return '<option value="' + i + '">' + esc(s) + "</option>";
    }).join("");
    cat.value = st.cat;
    $("types").innerHTML = TYPE_ORDER.map(function (k) {
      return '<button class="chip" type="button" data-type="' + k + '" aria-pressed="' + (st.type === k) + '">' + esc(L.types[k]) + "</button>";
    }).join("");
    $("q").value = st.q;
  }

  function render() {
    var L = S[st.lang];
    // Lineup counts follow the other filters, so the numbers say what each robot would show.
    var lineup = [["", L.all]].concat(D.robots.map(function (r) { return [r, r]; }));
    $("lineup").innerHTML = lineup.map(function (r) {
      var n = D.items.filter(function (it) { return matches(it, "robot") && (!r[0] || it.robots.indexOf(r[0]) >= 0); }).length;
      return '<button class="robot" type="button" data-robot="' + r[0] + '" aria-pressed="' + (st.robot === r[0]) + '" style="--rc:' +
        (r[0] ? "var(--" + r[0] + ")" : "var(--ink)") + '"><b>' + esc(r[1]) + "</b><small>" + n + "</small></button>";
    }).join("");
    $("real").setAttribute("aria-pressed", st.real);
    $("vid").setAttribute("aria-pressed", st.vid);
    [].forEach.call(document.querySelectorAll("#types .chip"), function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-type") === st.type); });

    var shown = D.items.filter(function (it) { return matches(it); });
    $("count").textContent = fmt(L.count, { n: shown.length });
    $("clear").hidden = !filtered();

    var html = "";
    if (!filtered() && D.featured.length) {
      var byId = {}; D.items.forEach(function (it) { byId[it.id] = it; });
      html += '<section class="group featured"><h2>' + esc(L.featured) + '</h2><div class="grid">' +
        D.featured.map(function (id) { return card(byId[id]); }).join("") + "</div></section>";
    }
    var groups = {};
    shown.forEach(function (it) { (groups[it.section] = groups[it.section] || []).push(it); });
    Object.keys(groups).sort(function (a, b) { return a - b; }).forEach(function (s) {
      html += '<section class="group"><h2>' + esc(D.sections[st.lang][s]) + "<span>" + groups[s].length + "</span></h2>" +
        '<div class="grid">' + groups[s].map(card).join("") + "</div></section>";
    });
    if (!shown.length) html = '<div class="empty"><p>' + esc(L.empty) + '</p><button class="chip" type="button" id="clear2">' + esc(L.clear) + "</button></div>";
    $("main").innerHTML = html;
    writeHash();
  }

  function openVideo(id) {
    var it = D.items.filter(function (x) { return x.id === id; })[0];
    if (!it || !it.video) return;
    var v = it.video, L = S[st.lang];
    var file = v.provider === "file";
    $("player").hidden = file; $("vplayer").hidden = !file;
    if (file) {
      $("vplayer").src = v.id;
      var pr = $("vplayer").play(); if (pr && pr.catch) pr.catch(function () {});
    } else {
      $("player").src = v.provider === "youtube"
        ? "https://www.youtube-nocookie.com/embed/" + v.id + "?autoplay=1&rel=0"
        : "https://player.bilibili.com/player.html?bvid=" + v.id + "&autoplay=1&high_quality=1";
    }
    var p = v.provider === "youtube" ? "YouTube" : v.provider === "bilibili" ? "bilibili" : new URL(v.url).hostname;
    $("dlink").href = v.url; $("dlink").textContent = it.t[st.lang].name + " · " + fmt(L.openOn, { p: p });
    if ($("dlg").showModal) $("dlg").showModal(); else window.open(v.url, "_blank");
  }
  function stopVideo() {
    $("player").src = "about:blank";
    var vp = $("vplayer"); vp.pause(); vp.removeAttribute("src"); vp.load();
  }
  function closeVideo() { stopVideo(); if ($("dlg").open) $("dlg").close(); }

  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("button") : null;
    if (!t) return;
    if (t.hasAttribute("data-lang")) {
      st.lang = t.getAttribute("data-lang");
      try { localStorage.setItem("awesome-limx-lang", st.lang); } catch (err) {}
      renderChrome(); render();
    } else if (t.hasAttribute("data-robot")) { st.robot = t.getAttribute("data-robot"); render(); }
    else if (t.hasAttribute("data-type")) { var k = t.getAttribute("data-type"); st.type = st.type === k ? "" : k; render(); }
    else if (t.id === "real") { st.real = !st.real; render(); }
    else if (t.id === "vid") { st.vid = !st.vid; render(); }
    else if (t.id === "clear" || t.id === "clear2") {
      st.robot = ""; st.cat = ""; st.type = ""; st.real = false; st.vid = false; st.q = "";
      $("q").value = ""; $("cat").value = ""; render();
    }
    else if (t.hasAttribute("data-video")) openVideo(t.getAttribute("data-video"));
    else if (t.id === "dclose") closeVideo();
  });
  $("cat").addEventListener("change", function () { st.cat = this.value; render(); });
  var timer;
  $("q").addEventListener("input", function () { var v = this.value; clearTimeout(timer); timer = setTimeout(function () { st.q = v.trim(); render(); }, 120); });
  $("dlg").addEventListener("close", stopVideo);
  // Esc must close the player even when the video's own controls have focus.
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && $("dlg").open) { e.preventDefault(); closeVideo(); } });
  $("dlg").addEventListener("click", function (e) { if (e.target === this) closeVideo(); });
  window.addEventListener("hashchange", function () { readHash(); renderChrome(); render(); });

  readHash(); renderChrome(); render();
})();
</script>
</body>
</html>
